
name: FotMob Public Football API

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fotmob-api
  cancel-in-progress: false

jobs:
  build-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Fetch Football Data
        run: python fetch.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload API Files
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy Public API
        uses: actions/deploy-pages@v4
