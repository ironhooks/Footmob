
name: FotMob API Capture - Python Chromium

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "FotMob URL"
        required: true
        default: "https://www.fotmob.com/"
      wait_seconds:
        description: "Wait after loading (seconds)"
        required: true
        default: "20"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Verify Files
        run: |
          test -f capture.py || {
            echo "capture.py not found!"
            exit 1
          }

      - name: Run API Capture
        env:
          TARGET_URL: ${{ inputs.target_url }}
          WAIT_SECONDS: ${{ inputs.wait_seconds }}
        run: python capture.py

      - name: Upload Captured Data
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: FotMob-Network-Capture
          path: captures/
          retention-days: 7
          if-no-files-found: warn
